
name: Deploy UPI QR Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_dispatch can be launched against a selected ref. Never build
    # a non-production ref in the production Pages workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Check website
        run: npm run check

      - name: Check content quality and QR guidance
        run: npm run check:content

      - name: Check SEO metadata and indexability
        run: npm run check:seo

      - name: Package public site
        run: npm run package:site

      - name: Check AdSense loader, page allowlist and ads.txt
        run: npm run check:adsense

      - name: Verify homepage
        run: test -f index.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    # Defense in depth: only main may publish to the production Pages environment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
